;==============================
; Clash-Reyan-New.ini 转换模板（修复版 v5）
; 原有修复内容（v1-v4）：
;   1. [BUG FIX] 所有-手动/所有-自动 正则末尾多余空格已移除
;   2. [BUG FIX] 全部 XX-故转 由 fallback 改为 select
;   3. 新增 拒绝 规则集触发入口（广告拦截）
;   4. 将 🌏 Globe 重命名为 🌍 境外
;   5. IPTV 策略组默认改为直连
;   6. 台湾正则移除错误的 🇨🇳
;   7. 所有地区节点正则新增 (?i)
; v5 修改内容：
;   8. [REMOVE] 清理 CF官方优选1-50（CF-1 ~ CF-5）所有策略组及相关引用
;   9. [BUG FIX] 地区组正则移除 (?!.*直连)（当时为机场节点所加，v6 已随地区组一并删除）
; v6 修改内容（2026-10-06）：
;  10. [REMOVE] 不再订阅 HX 机场、退掉 RackNerd VPS：删除 所有-手动/所有-自动 与
;      香港/台湾/日本/新加坡/美国 各地区组（只装机场节点，删后为空组），业务组只留自建节点
;  11. [ADD] SEEK fallback 组（见下）
;==============================

;==============================
; 规则集定义（ruleset）
; 注意：规则按顺序匹配，越靠前优先级越高
;==============================

; 广告拦截 —— 放最前，命中即拒绝
ruleset=拒绝,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AdvertisingLite/AdvertisingLite.list

; 业务分流
ruleset=🤖 AI,https://raw.githubusercontent.com/iHub-2020/reyan_OpenClash/refs/heads/main/AI.list
ruleset=💻 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/GitHub/GitHub.list
ruleset=🐳 Docker,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Docker/Docker.list
ruleset=✈️ Telegram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list
ruleset=💬 WhatsApp,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Whatsapp/Whatsapp.list
ruleset=📹 Youtube,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list

ruleset=📺 IPTV,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/IPTV/IPTV.list
ruleset=🚀 代理,https://raw.githubusercontent.com/iHub-2020/reyan_OpenClash/refs/heads/main/Proxy.list
ruleset=🌍 境外,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Global/Global.list
ruleset=🏠 国内,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Direct/Direct.list
ruleset=🏠 国内,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/China/China.list
ruleset=🏠 国内,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/ChinaIPs/ChinaIPs.list
ruleset=🏠 国内,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]MATCH

;==============================
; 策略组定义（custom_proxy_group）
;==============================

;--- 业务分流组 ---

custom_proxy_group=🤖 AI`select`[]自建日本1-故转`[]自建日本2-故转`[]自建日本3-故转`[]自建美国1-故转`[]直连`[]拒绝
custom_proxy_group=💻 GitHub`select`[]自建日本1-故转`[]自建日本2-故转`[]自建日本3-故转`[]自建美国1-故转`[]直连`[]拒绝
custom_proxy_group=🐳 Docker`select`[]自建日本1-故转`[]自建日本2-故转`[]自建日本3-故转`[]自建美国1-故转`[]直连`[]拒绝
custom_proxy_group=✈️ Telegram`select`[]自建日本1-故转`[]自建日本2-故转`[]自建日本3-故转`[]自建美国1-故转`[]直连`[]拒绝
custom_proxy_group=💬 WhatsApp`select`[]自建日本1-故转`[]自建日本2-故转`[]自建日本3-故转`[]自建美国1-故转`[]直连`[]拒绝
custom_proxy_group=📹 Youtube`select`[]自建日本1-故转`[]自建日本2-故转`[]自建日本3-故转`[]自建美国1-故转`[]直连`[]拒绝

; IPTV 默认直连（国内流媒体，不应走代理）
custom_proxy_group=📺 IPTV`select`[]直连`[]自建日本1-故转`[]自建日本2-故转`[]自建日本3-故转`[]自建美国1-故转`[]拒绝

custom_proxy_group=🚀 代理`select`[]自建日本1-故转`[]自建日本2-故转`[]自建日本3-故转`[]自建美国1-故转`[]直连`[]拒绝
custom_proxy_group=🌍 境外`select`[]自建日本1-故转`[]自建日本2-故转`[]自建日本3-故转`[]自建美国1-故转`[]直连`[]拒绝

; SEEK：直连优先，直连健康检查失败（被劫持/超时）时切自建美国1（2026-10-06，B-057）
;   家宽 IP 的 Cloudflare 挑战十秒内自动过，机房 IP 要人手勾选，所以不能常驻美国节点。
;   健康检查只看 TLS 是否成功（mihomo 会校验证书），不看状态码。
;   路由器自定义规则里 seek.com 与 challenges.cloudflare.com 都指向本组（两者必须同出口）。
custom_proxy_group=SEEK`fallback`[]DIRECT`[]自建美国1-故转`https://nz.seek.com/cdn-cgi/trace`120,5

;--- 国内/漏网之鱼策略 ---
custom_proxy_group=🏠 国内`select`[]直连
custom_proxy_group=🐟 漏网之鱼`select`[]自建日本1-故转`[]自建日本2-故转`[]自建日本3-故转`[]自建美国1-故转`[]直连`[]拒绝

;--- 自建日本1/2（Oracle）：自动组排除 Reality，故转默认走自动组（2026-10-06）
;   Oracle 各端口的线路几分钟就在 ~85ms / ~190ms 两档之间换，固定一个协议不是最优；
;   url-test 每 300s 选最快的。Reality 每次新建连接多一轮握手（实测 P90 700~800ms），
;   而 url-test 测的是复用连接的延迟看不出这点，所以不让它参与自动选择（手动组里仍保留）。
;--- 自建日本1节点组 ---
custom_proxy_group=自建日本1-故转`select`[]自建日本1-自动`[]自建日本1-手动
custom_proxy_group=自建日本1-手动`select`(?i).*oracle1.*
custom_proxy_group=自建日本1-自动`url-test`(?i)^(?=.*oracle1)(?!.*reality).*$`http://www.gstatic.com/generate_204`300,,50

;--- 自建日本2节点组 ---
custom_proxy_group=自建日本2-故转`select`[]自建日本2-自动`[]自建日本2-手动
custom_proxy_group=自建日本2-手动`select`(?i).*oracle2.*
custom_proxy_group=自建日本2-自动`url-test`(?i)^(?=.*oracle2)(?!.*reality).*$`http://www.gstatic.com/generate_204`300,,50

;--- 自建日本3节点组（Linode Tokyo 3 / linodes2）---
custom_proxy_group=自建日本3-故转`select`[]自建日本3-手动`[]自建日本3-自动
custom_proxy_group=自建日本3-手动`select`(?i).*linodes2.*
custom_proxy_group=自建日本3-自动`url-test`(?i).*linodes2.*`http://www.gstatic.com/generate_204`300,,50

;--- 自建美国1节点组（Linode Los Angeles / linodes1）---
; 2026-08-11 新增。B-040 实测：LAX 是九个美国机房里最优的一个
;   sz 190.6ms / 0% 丢 / 抖动仅 0.8ms；ht 205.3ms / 0% 丢
;   （Fremont 老机房 207ms 且丢 6%、抖动 63.9ms；其余六个 264-288ms）
; 节点名形如 Linodes1_Reality / Linodes1_Tuic / Linodes1_Hysteria2 / Linodes1_AnyTLS
custom_proxy_group=自建美国1-故转`select`[]自建美国1-手动`[]自建美国1-自动
custom_proxy_group=自建美国1-手动`select`(?i).*linodes1.*
custom_proxy_group=自建美国1-自动`url-test`(?i).*linodes1.*`http://www.gstatic.com/generate_204`300,,50


;--- 特殊节点 ---
custom_proxy_group=直连`select`[]DIRECT
custom_proxy_group=拒绝`select`[]REJECT

;==============================
; 订阅转换参数
;==============================
enable_rule_generator=true
overwrite_original_rules=true
